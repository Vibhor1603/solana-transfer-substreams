syntax = "proto3";

package solana.transfers.v1;

// Transfers extracted from one Solana block.
message Transfers {
  repeated Transfer transfers = 1;
}

// One transfer instruction. `from` / `to` are wallet (owner) addresses
// for SPL / Token-2022, and native pubkeys for System Program transfers.
message Transfer {
  string from = 1;
  string to = 2;
  uint64 amount = 3;
}
